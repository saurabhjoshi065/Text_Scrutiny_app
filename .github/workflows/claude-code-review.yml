name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.pull_request
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get PR details
        id: pr
        uses: actions/github-script@v6
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return {
              head: pr.data.head.sha,
              base: pr.data.base.sha,
              head_ref: pr.data.head.ref,
              base_ref: pr.data.base.ref
            };

      - name: Generate diff
        id: diff
        run: |
          git fetch origin ${{ fromJson(steps.pr.outputs.result).base_ref }}:${{ fromJson(steps.pr.outputs.result).base_ref }}
          git fetch origin ${{ fromJson(steps.pr.outputs.result).head_ref }}:${{ fromJson(steps.pr.outputs.result).head_ref }}
          
          DIFF=$(git diff ${{ fromJson(steps.pr.outputs.result).base_ref }}..${{ fromJson(steps.pr.outputs.result).head_ref }} --unified=3)
          
          # Save diff to file for Claude API
          echo "$DIFF" > pr_diff.txt
          
          # Truncate if too long (Claude API limits)
          if [ ${#DIFF} -gt 8000 ]; then
            DIFF=$(echo "$DIFF" | head -c 8000)
            DIFF="$DIFF... [truncated]"
          fi
          
          echo "diff_content<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Claude API
        id: claude
        uses: actions/github-script@v6
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        with:
          script: |
            const comment = context.payload.comment.body;
            const diff = `${{ steps.diff.outputs.diff_content }}`;
            
            // Extract command after @claude
            const claudeCommand = comment.replace(/@claude\s*/i, '').trim();
            
            if (!process.env.CLAUDE_API_KEY) {
              return "❌ Claude API key not configured. Please add CLAUDE_API_KEY to repository secrets.";
            }
            
            try {
              const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': process.env.CLAUDE_API_KEY,
                  'anthropic-version': '2023-06-01'
                },
                body: JSON.stringify({
                  model: 'claude-3-sonnet-20240229',
                  max_tokens: 1000,
                  messages: [{
                    role: 'user',
                    content: `You are a code reviewer. Here's the PR diff:\n\n\`\`\`diff\n${diff}\n\`\`\`\n\nUser request: ${claudeCommand}\n\nPlease provide a concise response focusing on the requested analysis.`
                  }]
                })
              });
              
              if (!response.ok) {
                throw new Error(`Claude API error: ${response.status}`);
              }
              
              const data = await response.json();
              return data.content[0].text;
            } catch (error) {
              console.error('Claude API call failed:', error);
              return `❌ Failed to call Claude API: ${error.message}`;
            }

      - name: Post Claude response
        uses: actions/github-script@v6
        with:
          script: |
            const response = `${{ steps.claude.outputs.result }}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **Claude Response:**\n\n${response}`
            });

  prepare-diff-for-manual-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch all branches
        run: git fetch --all

      - name: Generate git diff
        run: |
          DIFF=$(git diff origin/main...HEAD --unified=3 | head -c 10000)
          echo "$DIFF" > diff.txt
          echo "-------------------- COPY THIS INTO CLAUDE --------------------"
          echo "$DIFF"
          echo "--------------------------------------------------------------"
