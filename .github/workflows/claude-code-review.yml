name: Claude Code Review Prep

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  prepare-diff-for-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch all branches
        run: git fetch --all

      - name: Generate git diff
        run: |
          DIFF=$(git diff origin/main...HEAD --unified=3 | head -c 10000)
          echo "$DIFF" > diff.txt
          echo "-------------------- COPY THIS INTO CLAUDE --------------------"
          echo "$DIFF"
          echo "--------------------------------------------------------------"
